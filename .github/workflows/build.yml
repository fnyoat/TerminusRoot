name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false
          cache-cleanup: never

      - name: Build native bridge
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          if [ -z "$NDK" ]; then
            NDK="$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          echo "Using NDK: $NDK"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          "$TC/aarch64-linux-android24-clang" -O2 -fPIE -pie -o app/src/main/jniLibs/arm64-v8a/libtermbridge.so app/src/main/native/termbridge.c
          "$TC/x86_64-linux-android24-clang" -O2 -fPIE -pie -o app/src/main/jniLibs/x86_64/libtermbridge.so app/src/main/native/termbridge.c
          file app/src/main/jniLibs/arm64-v8a/libtermbridge.so

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TerminusRoot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
